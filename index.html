<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f2" />
    <script>
      // Apply the saved appearance before the page paints.
      (() => {
        let theme = "system";
        try {
          const stored = localStorage.getItem("codex-web:theme");
          if (["light", "dark", "system"].includes(stored)) theme = stored;
        } catch {}
        const dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#161715" : "#f5f5f2");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./src/assets/codex-favicon.svg" />
    <title>Codex Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
