# Replace root with the absolute path to your exported dist-mock directory.
server {
    listen 8080;
    server_name _;
    root /home/pldz1/local/codex-webui-lite/dist-mock;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Demo mode has no API. Do not fall back to index.html for these requests.
    location /api/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
}
